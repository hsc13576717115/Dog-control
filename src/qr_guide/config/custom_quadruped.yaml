robot:
  # 机器人名称仅作为参数标识，不参与控制计算。
  name: custom_quadruped
  # 机身外形尺寸，单位 m，主要用于文档和惯量建模参考。
  body_size_m: [0.250, 0.223, 0.110]

  mass:
    # 总质量和分部质量由实测数据给定。
    # 2025-05-14 更新：实机称重 total = 15.15 kg（原 13.75 kg，+10.2%）。
    # 各部分按质量比例缩放，惯性张量同步按比例放大。
    total_mass_kg: 15.15
    body_mass_kg: 7.21
    leg_mass_each_kg: 1.98
    thigh_mass_each_kg: 1.71
    calf_mass_each_kg: 0.28
    # 当前 body frame 原点按整机 COM 处理，因此偏移设为 0。
    com_offset_m: [0.0, 0.0, 0.0]
    # 机身盒体惯量，仅作为参考，不直接作为控制默认惯量。
    body_inertia_kg_m2_diag: [0.037182, 0.044858, 0.067487]
    # 控制器默认使用整机惯量。
    whole_robot_inertia_kg_m2_diag: [0.313310, 0.536326, 0.395196]

  # 髋安装点定义在 body frame 下，腿序固定为 FR / FL / RR / RL。
  # 当前自定义机器人坐标约定：body / hip 坐标系均取 y>0 为机器人右侧。
  hip_mounts_in_body:
    FR: [0.185,  0.055, 0.0]
    FL: [0.185, -0.055, 0.0]
    RR: [-0.185,  0.055, 0.0]
    RL: [-0.185, -0.055, 0.0]

  leg_geometry:
    # l0: 髋轴到腿平面的横向偏移
    # l1: 大腿长度
    # l2: 小腿长度
    # foot_radius_m: 当世界系原点定义在地面时，估计器里用于 _feetH 的足端半径参考
    l0: 0.08415
    l1: 0.213
    l2: 0.213
    foot_radius_m: 0.025

  drive:
    # 串口顺序和腿序保持一致，避免驱动映射混乱。
    serial_ports:
      FR: /dev/ttyS3
      FL: /dev/ttyS4
      RR: /dev/ttyS7
      RL: /dev/ttyS8
    # 默认关闭 4 腿并发收发，先按 FR -> FL -> RR -> RL 顺序单线程通信以提升稳定性。
    use_parallel_leg_io: false
    base_gear_ratio: 6.33
    calf_total_gear_ratio: 12.66

  joint_limits:
    # 三个关节的机械限位，IK 结果会在状态机里再次做限幅保护。
    q0: [-2.60, 2.60]
    q1: [-6.50, 6.50]
    q2: [-2.30, 2.30]

  stand_targets:
    # 站立和匍匐目标统一定义为 hip frame 下的足端目标位置。
    # 同样采用 y>0 为机器人右侧，因此 FR / RR 的 y 为正。
    normal_feet_in_hip:
      FR: [-0.03,  0.08415, -0.26]
      FL: [-0.03, -0.08415, -0.26]
      RR: [-0.05,  0.08415, -0.26]
      RL: [-0.05, -0.08415, -0.26]
      # FR: [-0.03,  0.10415, -0.26]
      # FL: [-0.03, -0.10415, -0.26]
      # RR: [-0.05,  0.10415, -0.26]
      # RL: [-0.05, -0.10415, -0.26]
    crouch_feet_in_hip:
      FR: [-0.03,  0.15, -0.15]
      FL: [-0.03, -0.15, -0.15]
      RR: [-0.03,  0.15, -0.15]
      RL: [-0.03, -0.15, -0.15]

  hybrid_stand:
    # FixedStand 主开关：true 表示使用“位置环起身 -> VMC 力位混合保持”。
    enabled: true
    # 当前稳定模式是 vmc；旧的 QP/纯力矩实验不从这里切。
    force_mode: vmc
    # roll/pitch 姿态补偿会转换成四条腿的竖直力差。
    # 过大：容易前后/左右抖；过小：机身倾斜时扶正慢。
    kp_roll: 20.0
    kd_roll: 0.8
    kp_pitch: 20.0
    kd_pitch: 0.8
    # VMC 足端虚拟弹簧/阻尼，单位约为 N/m 和 N/(m/s)，顺序为 [x, y, z]。
    # x: 抑制前后窜动；y: 抑制内收/外扩；z: 提供站立高度和抗下陷。
    # 太大：腿会硬、抖、容易触发力矩限幅；太小：足端漂、机身软。
    vmc_kp_foot: [300.0, 700.0, 900.0]
    vmc_kd_foot: [6.0, 8.0, 60.0]
    # 足端误差限幅，避免趴地或打滑瞬间把 VMC 力矩打满。
    vmc_error_limit_m: [0.03, 0.03, 0.04]
    # 重力补偿比例；1.0 约等于按整机质量完整补偿。
    vmc_gravity_scale: 1.0
    # 根据 pitch 动态做前后腿载荷迁移：pitch<0 时后腿加力、前腿减力，反向则相反。
    # kp/kd 越大，前后腿补偿越积极；limit 限制单腿前后分配差，防止突然翘头/点头。
    vmc_pitch_load_shift_kp: 80.0
    vmc_pitch_load_shift_kd: 5.0
    vmc_pitch_load_shift_limit_n: 12.0
    # 起身同步：当前腿运动学高度高于后腿时，前腿目标放慢、后腿辅助力增加。
    # 用来处理重心靠后时“前腿先起来、后腿无力”的问题。
    vmc_lift_sync_load_kp: 160.0
    vmc_lift_sync_load_limit_n: 7.0
    vmc_lift_sync_z_gain: 0.30
    vmc_lift_sync_z_limit_m: 0.012
    # q0/hip 外展 VMC 前馈力矩单独限幅；位置环仍由 vmc_joint_hold_kp[0] 保持。
    vmc_q0_tau_limit_nm: 8.0
    # VMC 阶段保留关节位置约束，顺序 [q0, q1, q2]。
    # q0 偏大可以压住内收；q1/q2 偏大更硬但更容易一顿一顿。
    vmc_joint_hold_kp: [16.0, 6.0, 6.0]
    vmc_joint_hold_kd: [0.30, 0.20, 0.20]
    # handoff 门槛：只有位置环起身足够接近站立姿态后，才允许切入 VMC 力矩接管。
    # 切太早会塌；切太晚会一直 handoff_wait。
    vmc_handoff_min_height_m: 0.240
    vmc_handoff_max_rp_rad: 0.10
    vmc_handoff_max_foot_error_m: [0.025, 0.025, 0.035]
    # handoff 前的位置环起身增益，顺序 [q0, q1, q2]。
    # 起身不够力优先略增 q1/q2 或 prehandoff_lift_scale；抖动则降 Kp 或升周期。
    vmc_prehandoff_joint_kp: [80.3, 80.3, 80.3]
    vmc_prehandoff_joint_kd: [0.45, 0.45, 0.45]
    # 叠加竖直重力辅助，避免卡在趴地高度起不来。
    vmc_prehandoff_lift_scale: 1.25
    vmc_prehandoff_tau_limit_nm: 23.0
    # 四条腿竖直支撑力限幅，单位 N。
    fz_min_per_leg_n: 0.0
    fz_max_per_leg_n: 60.0
    # 关节前馈力矩限幅和变化率限幅，单位 N*m、N*m/s。
    tau_limit_nm: 23.0
    tau_rate_limit_nm_per_s: 120.0
    # FixedStand VMC：VMC tau 从 0 缓慢爬升到完整输出，关节位置环同步降到低刚度保持值。
    force_ramp_duration_s: 1.5
    max_force_scale: 1.00

  velocity_limits:
    # 机体速度限制主要用于上层行为或步态参数裁剪。
    x: [-3.0, 3.0]
    y: [-1.0, 1.0]
    yaw: [-1.0, 1.0]

  joy_mapping:
    # 手柄速度映射统一走：极小死区 -> 线性映射 -> 加速度限幅 -> 机体系限幅。
    deadband: 0.02
    expo: 1.0
    max_vx: 0.6
    max_vy: 0.3
    max_yaw: 0.5
    # 第一阶段按“先稳后快”调，先把中低速和回中行为跑顺。
    max_accel_x: 1.2
    max_accel_y: 0.9
    max_accel_yaw: 2.0

  trot:
    # 默认不用 QP：无速度指令时四足站立待命，有速度指令后才启动对角 trot。
    # 当前 YAML 只暴露已调通的 vmc 路径；planar_vmc 实验参数已删除。
    # QP 旧路径仍在代码里，兼容参数保留在 force_control，平时不建议切回。
    force_mode: vmc
    # 手柄启动/停止阈值。start 略大于 stop，避免摇杆噪声导致 gait start/stop 反复跳。
    # 这里不是明显延迟：真实推杆会立刻超过 0.03；0.02s 防抖只过滤一两个控制周期的毛刺。
    gait_start_command_eps: 0.03
    gait_stop_command_eps: 0.02
    # 启动防抖和 gait ramp。gait_ramp 仍为 0，避免真正推杆时先等一段再走。
    gait_start_debounce_s: 0.02
    gait_ramp_cycles: 0.0
    # 对角 trot 周期，单位 s。代码固定 0.5 支撑相 / 0.5 摆动相：
    # 周期变大足端更慢、更稳但响应慢；周期变小步频高、冲击大。
    cycle_time: 0.60
    # 摆动腿抬脚高度，单位 m。砸地明显可略增，机身上下起伏大则略降。
    lift_height: 0.08
    # 摆动腿 z 方向使用非对称摆线：前 25% 快速抬脚，后 75% 慢速落脚。
    # 越小越“快抬慢落”；太小会像突然抬腿，太大落地会更急。
    swing_lift_peak_phase: 0.25
    # 四腿 idle_hold 时的足端 VMC。无手柄输入时用这组参数保持站立。
    vmc_kp_foot: [240.0, 220.0, 760.0]
    vmc_kd_foot: [7.0, 9.0, 72.0]
    vmc_error_limit_m: [0.03, 0.03, 0.04]
    vmc_q0_tau_limit_nm: 8.0
    # 两腿 active_trot 支撑相足端 VMC。trot 只有两条腿支撑，因此不能直接照搬站立力。
    # 太大：支撑相轨迹不明显、腿像钉在地上；太小：支撑腿下陷、机身掉高。
    active_vmc_kp_foot: [260.0, 200.0, 2000.0]
    active_vmc_kd_foot: [5.0, 3.5, 56.0]
    active_vmc_error_limit_m: [0.035, 0.035, 0.05]
    active_vmc_q0_tau_limit_nm: 8.0
    # 支撑足在地面相对机身向后/侧向滑动的轨迹放大系数。
    # 走不出来时优先看这个和 cycle_time；太大则滑移/冲击。
    stance_trajectory_gain: 1.0
    # roll/pitch 姿态补偿转换到支撑腿 z 力。gain 加大可减少走着走着姿态歪；
    # limit 限制单腿最多增减多少 N，避免姿态估计噪声把某条腿猛顶。
    vmc_attitude_fz_gain: 3.0
    vmc_attitude_fz_limit_n: 12.0
    # 足端力变化率限幅。太低会“慢半拍/支撑软”，太高会冲击和抖动。
    vmc_force_rate_limit_n_per_s: 3000.0
    # active_trot 两腿支撑时的前馈力矩变化率限幅。
    # 新支撑腿刚落地时不能沿用全局 50Nm/s 慢慢爬升，否则 Fz 已经算出来但 tau 还很小，机身会先下榻。
    active_tau_rate_limit_nm_per_s: 750.0
    # active_trot 后腿额外 z 向预载。后腿明显塌时小幅加；前后俯仰变大或后腿弹跳时减小。
    active_rear_fz_boost_n: 14.0
    # active_trot 对角两腿支撑时，将两条支撑腿的 z 力向平均值拉近。
    # 解决 FL/RR 或 FR/RL 中某一条腿顶满、另一条腿卸载导致越走越歪。
    active_diagonal_fz_balance_gain: 0.55
    # VMC 单腿 z 向力下/上限。active_min 用来让新支撑腿落地后先接住一部分重量，
    # 避免从 0N 慢慢爬升导致先下陷；active_max 防止随后猛顶。
    idle_fz_min_per_leg_n: 8.0
    active_fz_min_per_leg_n: 55.0
    idle_fz_max_per_leg_n: 75.0
    active_fz_max_per_leg_n: 120.0
    # gait 停止后，从当前足端位置平滑回到站立足端，避免直接切回 nominal 时猛拽一下。
    idle_settle_duration_s: 0.20
    # 关节位置环增益，顺序 [q0, q1, q2]。
    # stance_joint_* 用于四腿 idle_hold；active_stance_joint_* 用于两腿支撑；swing_joint_* 用于摆动腿。
    # hip/q0 主要控制腿宽和内收；q1/q2 主要控制腿长和摆动轨迹刚性。
    stance_joint_kp: [72.0, 32.0, 32.0]
    stance_joint_kd: [0.42, 0.34, 0.34]
    active_stance_joint_kp: [72.0, 34.0, 34.0]
    active_stance_joint_kd: [0.42, 0.34, 0.34]
    swing_joint_kp: [72.0, 28.0, 28.0]
    swing_joint_kd: [0.42, 0.30, 0.30]
    # 落脚点相对站立足端的最大 x/y 平移，限制单步太大导致 IK 激进或打滑。
    max_foothold_shift_x: 0.08
    max_foothold_shift_y: 0.05
    # Trot 调试日志周期，单位 s。调参时 0.05~0.10，稳定后可调大减少刷屏。
    debug_print_period_s: 0.10

  force_control:
    # 这个块是全局力控/安全参数。
    # 当前默认 trot.force_mode=vmc 时，主要用到：
    #   friction_ratio: 限制足端 xy 力，防止水平力超过摩擦锥；
    #   tau_limit / tau_rate_limit: 所有关节前馈力矩的最终安全限幅；
    #   acc_* / w_*_sat: calcBodyWrench 的加速度/角加速度饱和，保留给日志和 QP 兼容。
    # kp/kd/QP 权重仍保留，因为 State_FixedStand/State_Trotting 构造和 QP 兼容路径会读取它们。
    kp_body_xyz: [20, 20, 8]
    kd_body_xyz: [4.0, 4.0, 1.0]
    kp_body_rpy: [200, 200, 10]
    kd_body_rpy: [2, 2, 2]
    # 仅 QP/旧路径摆动腿足端 PD 使用；当前 VMC trot 的摆动腿使用 trot.swing_joint_*。
    kp_swing: [330, 330, 330]
    kd_swing: [9, 9, 9]
    # QP 权重：s=质心动力学跟踪，w=足端力正则化，u=力变化平滑。
    # 当前默认 VMC 不调这些；只有把 trot.force_mode 改成 qp 才会明显参与。
    s_xyz: [22, 22, 22]
    s_rpy: [50, 50, 50]
    w_per_foot: [10, 10, 40]
    u_per_foot: [3, 3, 3]
    alpha: 0.05
    beta: 0.2
    # 摩擦系数估计。xy 力最大值约为 friction_ratio * Fz。
    # 太小：支撑相水平推进力不足；太大：容易打滑或突然横向冲击。
    friction_ratio: 0.4
    # 全局前馈力矩安全限幅。注意这不是位置环输出限幅，而是 tau 前馈限幅。
    tau_limit: 23.0
    # 全局前馈力矩变化率限幅。太低会慢、软；太高会冲击、抖。
    tau_rate_limit: 50.0
    # QP 模式进入时的力矩爬升步数；当前 VMC 模式基本不靠这个起步。
    transition_steps: 500.0
    # Body wrench 期望加速度/角加速度饱和，防止姿态估计噪声引起过大计算值。
    acc_xy_sat: [-3, 3]
    acc_z_sat: [-5, 5]
    w_roll_pitch_sat: [-15, 15]
    w_yaw_sat: [-10, 10]

  stand:
    # 旧位置环站立参数；FixedStand 当前主逻辑还会读取 body_height 和 entry_duration。
    # entry_duration 是起身插值步数：越大越慢越柔，越小响应快但冲击大。
    entry_duration: 200
    # 站立目标机身高度。实际能否达到还受 normal_feet_in_hip.z、腿长和 handoff 门槛影响。
    body_height: 0.28
    # 旧位置环姿态/高度补偿参数；当前 VMC 主要靠 hybrid_stand 里的姿态和足端力参数。
    roll_pitch_comp_gain: 0.08
    height_comp_gain: 0.15
    compensation_limit: 0.02
