robot:
  # 机器人名称仅作为参数标识，不参与控制计算。
  name: custom_quadruped
  # 机身外形尺寸，单位 m，主要用于文档和惯量建模参考。
  body_size_m: [0.250, 0.223, 0.110]

  mass:
    # 总质量和分部质量由实测数据给定。
    total_mass_kg: 13.75
    body_mass_kg: 6.55
    leg_mass_each_kg: 1.80
    thigh_mass_each_kg: 1.55
    calf_mass_each_kg: 0.25
    # 当前 body frame 原点按整机 COM 处理，因此偏移设为 0。
    com_offset_m: [0.0, 0.0, 0.0]
    # 机身盒体惯量，仅作为参考，不直接作为控制默认惯量。
    body_inertia_kg_m2_diag: [0.033748, 0.040719, 0.061258]
    # 控制器默认使用整机惯量。
    whole_robot_inertia_kg_m2_diag: [0.284357, 0.486763, 0.358663]

  # 髋安装点定义在 body frame 下，腿序固定为 FR / FL / RR / RL。
  # 当前自定义机器人坐标约定：body / hip 坐标系均取 y>0 为机器人右侧。
  hip_mounts_in_body:
    FR: [0.185,  0.055, 0.0]
    FL: [0.185, -0.055, 0.0]
    RR: [-0.185,  0.055, 0.0]
    RL: [-0.185, -0.055, 0.0]

  leg_geometry:
    # l0: 髋轴到腿平面的横向偏移
    # l1: 大腿长度
    # l2: 小腿长度
    # foot_radius_m: 当世界系原点定义在地面时，估计器里用于 _feetH 的足端半径参考
    l0: 0.08415
    l1: 0.213
    l2: 0.213
    foot_radius_m: 0.025

  drive:
    # 串口顺序和腿序保持一致，避免驱动映射混乱。
    serial_ports:
      FR: /dev/ttyS3
      FL: /dev/ttyS4
      RR: /dev/ttyS7
      RL: /dev/ttyS8
    # 默认关闭 4 腿并发收发，先按 FR -> FL -> RR -> RL 顺序单线程通信以提升稳定性。
    use_parallel_leg_io: false
    base_gear_ratio: 6.33
    calf_total_gear_ratio: 12.66

  joint_limits:
    # 三个关节的机械限位，IK 结果会在状态机里再次做限幅保护。
    q0: [-2.60, 2.60]
    q1: [-6.50, 6.50]
    q2: [-2.30, 2.30]

  stand_targets:
    # 站立和匍匐目标统一定义为 hip frame 下的足端目标位置。
    # 同样采用 y>0 为机器人右侧，因此 FR / RR 的 y 为正。
    normal_feet_in_hip:
      FR: [-0.03,  0.08415, -0.24]
      FL: [-0.03, -0.08415, -0.24]
      RR: [-0.03,  0.08415, -0.24]
      RL: [-0.03, -0.08415, -0.24]
    crouch_feet_in_hip:
      FR: [-0.03,  0.15, -0.15]
      FL: [-0.03, -0.15, -0.15]
      RR: [-0.03,  0.15, -0.15]
      RL: [-0.03, -0.15, -0.15]

  hybrid_stand:
    # 默认关闭。当前这版混合控制还没有完成 IMU 坐标和实机增益的联调，
    # 先保留纯位控站立作为更稳妥的基线。
    enabled: false
    # FixedStand 的第一版力位混合参数。
    # z 通道负责机身高度支撑，roll / pitch 负责姿态恢复。
    kp_z: 1200.0
    kd_z: 120.0
    kp_roll: 18.0
    kd_roll: 1.2
    kp_pitch: 18.0
    kd_pitch: 1.2
    # 四条腿竖直支撑力限幅，单位 N。
    fz_min_per_leg_n: 10.0
    fz_max_per_leg_n: 60.0
    # 关节前馈力矩限幅和变化率限幅，单位 N*m、N*m/s。
    tau_limit_nm: 6.0
    tau_rate_limit_nm_per_s: 120.0

  velocity_limits:
    # 机体速度限制主要用于上层行为或步态参数裁剪。
    x: [-3.0, 3.0]
    y: [-1.5, 1.5]
    yaw: [-1.0, 1.0]

  joy_mapping:
    # 手柄速度映射统一走：死区 -> 非线性整形 -> 加速度限幅 -> 机体系限幅。
    deadband: 0.08
    expo: 3.0
    max_vx: 3.0
    max_vy: 1.5
    max_yaw: 1.0
    # 第一阶段按“先稳后快”调，先把中低速和回中行为跑顺。
    max_accel_x: 1.2
    max_accel_y: 0.9
    max_accel_yaw: 2.0

  trot:
    # 对角 trot 基础节拍，保持和 unitree_guide 相近的开放步态语义。
    cycle_time: 0.35
    stance_ratio: 0.5
    lift_height: 0.10
    # 落脚点由“剩余 swing 预瞄 + 半个 stance 预瞄 + 速度误差修正”共同决定。
    landing_preview_gain: 0.5
    vel_error_gain: 0.05
    # 平移足够小而偏航足够明显时，切到绕机体中心的几何化原地旋转。
    pure_yaw_threshold: 0.10
    pure_rotation_translation_eps: 0.05
    # 足端和关节安全限幅，防止第一阶段几何轨迹把 IK 推得太激进。
    max_foothold_shift_x: 0.08
    max_foothold_shift_y: 0.05
    max_joint_delta: 0.03

  stand:
    # 站立进入改成足端空间插值，再叠加低增益姿态补偿。
    entry_duration: 500
    body_height: 0.24
    roll_pitch_comp_gain: 0.08
    height_comp_gain: 0.15
    compensation_limit: 0.02
