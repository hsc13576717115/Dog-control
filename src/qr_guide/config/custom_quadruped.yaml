robot:
  # 机器人名称仅作为参数标识，不参与控制计算。
  name: custom_quadruped
  # 机身外形尺寸，单位 m，主要用于文档和惯量建模参考。
  body_size_m: [0.250, 0.223, 0.110]

  mass:
    # 总质量和分部质量由实测数据给定。
    # 2025-05-14 更新：实机称重 total = 15.15 kg（原 13.75 kg，+10.2%）。
    # 各部分按质量比例缩放，惯性张量同步按比例放大。
    total_mass_kg: 15.15
    body_mass_kg: 7.21
    leg_mass_each_kg: 1.98
    thigh_mass_each_kg: 1.71
    calf_mass_each_kg: 0.28
    # 当前 body frame 原点按整机 COM 处理，因此偏移设为 0。
    com_offset_m: [0.0, 0.0, 0.0]
    # 机身盒体惯量，仅作为参考，不直接作为控制默认惯量。
    body_inertia_kg_m2_diag: [0.037182, 0.044858, 0.067487]
    # 控制器默认使用整机惯量。
    whole_robot_inertia_kg_m2_diag: [0.313310, 0.536326, 0.395196]

  # 髋安装点定义在 body frame 下，腿序固定为 FR / FL / RR / RL。
  # 当前自定义机器人坐标约定：body / hip 坐标系均取 y>0 为机器人右侧。
  hip_mounts_in_body:
    FR: [0.185,  0.055, 0.0]
    FL: [0.185, -0.055, 0.0]
    RR: [-0.185,  0.055, 0.0]
    RL: [-0.185, -0.055, 0.0]

  leg_geometry:
    # l0: 髋轴到腿平面的横向偏移
    # l1: 大腿长度
    # l2: 小腿长度
    # foot_radius_m: 当世界系原点定义在地面时，估计器里用于 _feetH 的足端半径参考
    l0: 0.08415
    l1: 0.213
    l2: 0.213
    foot_radius_m: 0.025

  drive:
    # 串口顺序和腿序保持一致，避免驱动映射混乱。
    serial_ports:
      FR: /dev/ttyS3
      FL: /dev/ttyS4
      RR: /dev/ttyS7
      RL: /dev/ttyS8
    # 默认关闭 4 腿并发收发，先按 FR -> FL -> RR -> RL 顺序单线程通信以提升稳定性。
    use_parallel_leg_io: false
    base_gear_ratio: 6.33
    calf_total_gear_ratio: 12.66

  joint_limits:
    # 三个关节的机械限位，IK 结果会在状态机里再次做限幅保护。
    q0: [-2.60, 2.60]
    q1: [-6.50, 6.50]
    q2: [-2.30, 2.30]

  stand_targets:
    # 站立和匍匐目标统一定义为 hip frame 下的足端目标位置。
    # 同样采用 y>0 为机器人右侧，因此 FR / RR 的 y 为正。
    normal_feet_in_hip:
      FR: [-0.03,  0.08415, -0.255]
      FL: [-0.03, -0.08415, -0.255]
      RR: [-0.03,  0.08415, -0.255]
      RL: [-0.03, -0.08415, -0.255]
    crouch_feet_in_hip:
      FR: [-0.03,  0.15, -0.15]
      FL: [-0.03, -0.15, -0.15]
      RR: [-0.03,  0.15, -0.15]
      RL: [-0.03, -0.15, -0.15]

  hybrid_stand:
    # 开启后 FixedStand 使用 VMC 足端力矩站立。
    enabled: true
    force_mode: vmc
    # kp_* 暂时保留给旧轻量竖直力分配器；当前 FixedStand 使用下面的 VMC 足端弹簧/阻尼。
    kp_z: 1200.0
    kd_z: 120.0
    kp_roll: 8.0
    kd_roll: 0.8
    kp_pitch: 12.0
    kd_pitch: 0.8
    # VMC 足端虚拟弹簧/阻尼，单位约为 N/m 和 N/(m/s)。
    # FixedStand 使用 x/z 虚拟弹簧帮助起身和膝盖离地；y 向给中等约束保持腿宽。
    vmc_kp_foot: [300.0, 700.0, 900.0]
    vmc_kd_foot: [6.0, 8.0, 60.0]
    vmc_error_limit_m: [0.03, 0.03, 0.04]
    vmc_gravity_scale: 1.0
    # 根据 pitch 动态做前后腿载荷迁移：pitch<0 时后腿加力、前腿减力，反向则相反。
    vmc_pitch_load_shift_kp: 80.0
    vmc_pitch_load_shift_kd: 5.0
    vmc_pitch_load_shift_limit_n: 12.0
    # 起身同步：当前腿运动学高度高于后腿时，前腿目标放慢、后腿辅助力增加。
    vmc_lift_sync_load_kp: 160.0
    vmc_lift_sync_load_limit_n: 7.0
    vmc_lift_sync_z_gain: 0.30
    vmc_lift_sync_z_limit_m: 0.012
    # 旧纯力矩实验参数保留兼容；当前 FixedStand 使用 vmc_joint_hold_* 保留低刚度位置约束。
    vmc_min_cmd_kp: 0.0
    vmc_min_cmd_kd: 0.0
    vmc_q0_tau_limit_nm: 8.0
    # VMC 阶段保留低刚度关节位置约束，防止 q1/q2 足端漂移带动机身前后跑。
    vmc_joint_hold_kp: [16.0, 6.0, 6.0]
    vmc_joint_hold_kd: [0.30, 0.20, 0.20]
    # 只有位置环起身足够接近站立姿态后，才允许切入 VMC 力矩接管。
    vmc_handoff_min_height_m: 0.240
    vmc_handoff_max_rp_rad: 0.10
    vmc_handoff_max_foot_error_m: [0.025, 0.025, 0.035]
    # handoff 前只用位置环起身。
    vmc_prehandoff_joint_kp: [80.3, 80.3, 80.3]
    vmc_prehandoff_joint_kd: [0.45, 0.45, 0.45]
    # 叠加竖直重力辅助，避免卡在趴地高度起不来。
    vmc_prehandoff_lift_scale: 1.25
    vmc_prehandoff_tau_limit_nm: 23.0
    # 四条腿竖直支撑力限幅，单位 N。
    fz_min_per_leg_n: 0.0
    fz_max_per_leg_n: 60.0
    # 关节前馈力矩限幅和变化率限幅，单位 N*m、N*m/s。
    tau_limit_nm: 23.0
    tau_rate_limit_nm_per_s: 120.0
    # FixedStand VMC：VMC tau 从 0 缓慢爬升到完整输出，关节位置环同步降到低刚度保持值。
    force_ramp_duration_s: 1.5
    max_force_scale: 1.00

  velocity_limits:
    # 机体速度限制主要用于上层行为或步态参数裁剪。
    x: [-3.0, 3.0]
    y: [-1.5, 1.5]
    yaw: [-1.0, 1.0]

  joy_mapping:
    # 手柄速度映射统一走：死区 -> 非线性整形 -> 加速度限幅 -> 机体系限幅。
    deadband: 0.08
    expo: 3.0
    max_vx: 3.0
    max_vy: 1.5
    max_yaw: 1.0
    # 第一阶段按“先稳后快”调，先把中低速和回中行为跑顺。
    max_accel_x: 1.2
    max_accel_y: 0.9
    max_accel_yaw: 2.0

  trot:
    # 对角 trot 基础节拍，保持和 unitree_guide 相近的开放步态语义。
    cycle_time: 0.35
    stance_ratio: 0.5
    lift_height: 0.10
    # 落脚点由“剩余 swing 预瞄 + 半个 stance 预瞄 + 速度误差修正”共同决定。
    landing_preview_gain: 0.5
    vel_error_gain: 0.05
    # 平移足够小而偏航足够明显时，切到绕机体中心的几何化原地旋转。
    pure_yaw_threshold: 0.10
    pure_rotation_translation_eps: 0.05
    # 足端和关节安全限幅，防止第一阶段几何轨迹把 IK 推得太激进。
    max_foothold_shift_x: 0.08
    max_foothold_shift_y: 0.05
    max_joint_delta: 0.03

  force_control:
    # 移植自 unitree_guide 的力控制参数。
    # 针对 15.15 kg 机器人调参（原 13.75 kg，+10.2%）。
    # Body PD 增益：kp ∝ mass，kd ∝ sqrt(mass)。
    # 【首次测试保守值】确认稳定后再逐步调大
    kp_body_xyz: [20, 20, 8]
    kd_body_xyz: [4.0, 4.0, 1.0]
    kp_body_rpy: [200, 200, 10]
    kd_body_rpy: [2, 2, 2]
    # 摆动腿 PD 增益（轻微增大以补偿更大的机身惯性）
    kp_swing: [330, 330, 330]
    kd_swing: [9, 9, 9]
    # QP 权重：s=质心动力学跟踪, w=力正则化, u=时间平滑
    #  heavier robot → 更大的 s_xyz 以保证跟踪精度
    s_xyz: [22, 22, 22]
    s_rpy: [50, 50, 50]
    w_per_foot: [10, 10, 40]
    u_per_foot: [3, 3, 3]
    alpha: 0.05
    beta: 0.2
    friction_ratio: 0.4
    # 安全限幅（GO-M8010-6 额定扭矩 23.7 N·m，留 20% 余量）
    tau_limit: 23.0
    tau_rate_limit: 50.0
    transition_steps: 500.0
    # 期望加速度饱和
    acc_xy_sat: [-3, 3]
    acc_z_sat: [-5, 5]
    w_roll_pitch_sat: [-15, 15]
    w_yaw_sat: [-10, 10]

  stand:
    # 站立进入改成足端空间插值，再叠加低增益姿态补偿。
    entry_duration: 200
    body_height: 0.28
    roll_pitch_comp_gain: 0.08
    height_comp_gain: 0.15
    compensation_limit: 0.02
