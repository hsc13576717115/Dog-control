# M2 finite walking: body follows the mean displacement of four feet.
# Units: m, s, N, rad unless the key specifies otherwise. Versioned startup-only settings.
control:
  sole_rolling_model: 1.0
  body_follow_ratio: 0.25
  edge_margin_m: 0.02
  support_margin_m: 0.03
  target_tolerance_m: 0.02
  plane_tolerance_m: 0.002
  max_step_distance_m: 0.25
  max_surface_height_m: 0.051
  min_confidence: 0.9
  surface_timeout_s: 0.5
  state_timeout_s: 0.1
  plan_validity_s: 1.0
  body_drift_m: 0.005
  shift_s: 2.0
  swing_s: 1.5
  clearance_m: 0.06
  touchdown_timeout_s: 0.8
  preflight_period_s: 0.05
  lift_increment_m: 0.015
  load_on_n: 9.0
  load_off_n: 4.0
  contact_speed_mps: 0.1
  force_filter_s: 0.025
  load_dwell_s: 0.04
  unload_dwell_s: 0.025
  slip_speed_mps: 0.04
  slip_dwell_s: 0.06
  probe_force_n: 6.0
  probe_ramp_s: 0.15
  probe_travel_m: 0.008
  candidate_force_n: 2.0
  candidate_dwell_s: 0.04
  confirm_dwell_s: 0.15
  early_contact_delay_s: 0.15
  early_contact_fraction: 0.8
  startup_grace_s: 0.25
  startup_settle_s: 1.0
  startup_timeout_s: 5.0
  startup_kp: 60.0
  startup_kd: 3.0
  attitude_limit_rad: 0.35
  solve_timeout_ms: 20.0
  residual_limit: 0.001
  status_period_s: 0.02
  stance_kp: 120.0
  stance_kd: 24.0
  body_kp: 100.0
  body_kd: 25.0
  orientation_kp: 120.0
  orientation_kd: 25.0
  swing_kp: 250.0
  swing_kd: 30.0
  swing_weight: 5.0
  force_weight: 0.005
  joint_slack_weight: 100.0
  joint_margin_rad: 0.05
  ik_tolerance_m: 0.0005
  ik_delta_rad: 0.12
  acc_filter_s: 0.03
  acc_limit: 80.0
  swing_error_m: 0.025
  swing_error_dwell_s: 0.08
  coordinated_enabled: 1.0
  trajectory_duration_s: 120.0
  trajectory_body_speed_mps: 0.15
  trajectory_foot_speed_mps: 0.25
  trajectory_euler_speed_rps: 0.3
